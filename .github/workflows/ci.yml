name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify generated frontend assets
        run: |
          npm ci
          npm run build
          git diff --exit-code -- static/css/style.min.css static/js/nav.min.js static/js/dashboard.min.js static/js/tesla.min.js

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest tests/

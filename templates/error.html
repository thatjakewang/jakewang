{# Shared error page. `code` and `message` come from the error handlers
   in app/main.py. #}
{% extends 'base.html' %}

{% block title %}{{ code }} - {{ message }}{% endblock %}

{% block content %}
<section class="intro error-page">
    <h1>{{ code }}</h1>
    <p class="subtitle">{{ message }}</p>
    <p class="error-back">
        <a href="/">← Back to Home</a>
    </p>
</section>
{% endblock %}

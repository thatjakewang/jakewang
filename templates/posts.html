{% extends "base.html" %}
{% block content %}
<section class="posts-page">
    <h1>{{ heading }}</h1>
    <ul class="post-list">
        {% for post in posts %}
        <li>
            <time datetime="{{ post.date.isoformat() }}">{{ post.date.isoformat() }}</time>
            <span class="post-badge">{{ category_label }}</span>
            {% for tag in post.tags %}<span class="post-badge">{{ tag }}</span>{% endfor %}
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        </li>
        {% else %}
        <li>No posts yet.</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}

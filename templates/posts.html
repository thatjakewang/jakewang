{% extends "base.html" %}
{% block content %}
<section class="posts-page" lang="zh-Hant">
    <h1>{{ category_label }}</h1>
    <ul class="post-list">
        {% for post in posts %}
        <li>
            <time datetime="{{ post.date.isoformat() }}">{{ post.date.isoformat() }}</time>
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        </li>
        {% else %}
        <li>目前還沒有文章。</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}

# Lint settings (ruff check .). ruff is a dev dependency, see requirements-dev.txt.
line-length = 100
target-version = "py314"

[lint]
# pycodestyle, pyflakes, import order, likely bugs, outdated syntax.
select = ["E", "W", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults; that is not the
# mutable-default mistake B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
